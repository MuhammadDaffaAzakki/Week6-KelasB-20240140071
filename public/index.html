<!DOCTYPE html>
<html lang="id">
<head>

  <title>Etalase Produk - TokoOnline Asyik</title>
  <link rel="stylesheet" href="css/index.css">
</head>
<body>

      <div class="brand">TokoOnline Asyik</div>
      <ul>
        <li><a href="index.html" aria-current="page">Etalase</a></li>
        <li><a href="form.html">Generator Caption</a></li>
      </ul>
    </nav>
  </header>

  <container class="container">
    <h2>Katalog Produk</h2>
    <p style="margin-bottom: 1.5rem; color: #64748b;">Menampilkan data produk langsung dari DummyJSON</p>

    <!-- Fitur Cari & Filter -->

        <option value="">Semua Kategori</option>

    </div>
  </container>

  <script src="js/index.js"></script>

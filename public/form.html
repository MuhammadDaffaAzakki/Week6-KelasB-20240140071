<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generator Caption - TokoOnline Asyik</title>
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="css/form.css">
</head>
<body>
  <header>
    <nav>
      <div class="brand">TokoOnline Asyik</div>
      <ul>
        <li><a href="index.html">Etalase</a></li>
        <li><a href="form.html" aria-current="page">Generator Caption</a></li>
      </ul>
    </nav>
  </header>

  <container class="container">
    <div class="form-card">
      <h2>Generator Caption Produk</h2>
      <p style="margin-bottom: 1.5rem; color: #64748b;">Buat caption media sosial otomatis dengan format Rupiah dan Hashtag</p>

      <form id="captionForm" novalidate>
        <!-- Nama Produk -->
        <div class="form-group">
          <label for="productName">Nama Produk</label>
          <input type="text" id="productName" placeholder="Contoh: kopi susu aren">
          <small class="error-text" id="nameError">Wajib diisi, 3–60 karakter, dan harus mengandung huruf.</small>
        </div>

        <!-- Harga -->
        <div class="form-group">
          <label for="productPrice">Harga (Rp)</label>
          <input type="number" id="productPrice" placeholder="Contoh: 25000">
          <small class="error-text" id="priceError">Wajib diisi angka bulat, kisaran Rp 1.000 – Rp 100.000.000.</small>
        </div>

        <!-- Template -->
        <div class="form-group">
          <label for="templateSelect">Pilih Template</label>
          <select id="templateSelect">
            <option value="Promo">Promo 🔥</option>
            <option value="Santai">Santai ☕</option>
            <option value="Formal">Formal ✨</option>
          </select>
        </div>

        <button type="submit" class="btn-submit">Buat Caption</button>
      </form>

      <!-- Hasil Caption -->
      <div class="result-container">
        <label for="resultContent" class="result-label">Hasil Caption</label>
        <textarea id="resultContent" readonly placeholder="Hasil caption akan muncul di sini setelah Anda mengklik tombol 'Buat Caption'..."></textarea>
      </div>
    </div>
  </container>

  <script src="js/form.js"></script>
</body>
</html>
